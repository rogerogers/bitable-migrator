# yaml-language-server: $schema=../bitable.schema.json

app_token: "YOUR_APP_TOKEN"
tables:
  - table_id: "YOUR_TABLE_ID"
    name: "User Table"
    fields:
      - name: "Full Name"
        type: "Text"
      - name: "nihao"
        type: "MultiSelect"
      - name: "Age"
        type: "Number"
      - name: "Role"
        type: "SingleSelect"
        property:
          options:
            - name: "Admin"
            - name: "User"
      - name: "Avatar"
        type: "Attachment"
      - name: "Skills"
        type: "MultiSelect"
